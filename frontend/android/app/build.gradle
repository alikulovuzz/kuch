apply plugin: 'com.android.application'

// Release signing comes from outside the repo: ~/.gradle/gradle.properties (or -P) first, then the
// environment. Without all four values `assembleRelease` still succeeds and writes
// app-release-unsigned.apk, to be signed by hand as in docs/MOBILE.md. Never put these values,
// or the keystore, in this project: anything under frontend/android is committed.
def releaseSigningKeys = ['RELEASE_STORE_FILE', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
def releaseSigning = releaseSigningKeys.collectEntries { key ->
    def value = project.findProperty(key) ?: System.getenv(key)
    [(key): value ? value.toString() : null]
}
def hasReleaseSigning = releaseSigning.values().every { it }
if (!hasReleaseSigning && releaseSigning.values().any { it }) {
    logger.warn("Release signing is half configured (missing: ${releaseSigning.findAll { !it.value }.keySet().join(', ')}); release builds will be unsigned.")
}
// gradle.properties does not expand "~", and a keystore path there usually starts with it
def releaseStoreFile = { String path ->
    file(path.startsWith('~/') ? "${System.getProperty('user.home')}${path.substring(1)}" : path)
}

android {
    namespace "io.github.alikulovuzz.kuch"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.alikulovuzz.kuch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 27
        versionName "1.5.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFile(releaseSigning.RELEASE_STORE_FILE)
                storePassword releaseSigning.RELEASE_STORE_PASSWORD
                keyAlias releaseSigning.RELEASE_KEY_ALIAS
                keyPassword releaseSigning.RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // The barcode scanner's ML Kit library ships a native build for four CPU families.
            // Phones are ARM; the two x86 builds only serve emulators and a few Chromebooks, which
            // run ARM code through translation anyway. Leaving them out takes about 12 MB off
            // the APK. Release only: the debug build keeps x86_64 for the emulator test rig.
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
        debug {
            // Test build installs side-by-side with the real app: its own applicationId, so both
            // can live on one device. The name/icon label is overridden by the debug resource
            // overlay in src/debug/res. The release build (the "real" app) is untouched.
            applicationIdSuffix ".test"
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Writing workouts and weigh-ins to Health Connect (#200, HealthConnectPlugin). Off until the
    // user turns it on. 1.1.0-alpha12 is the last release that builds with compileSdk 35 and AGP
    // 8.7; 1.1.0 stable asks for compileSdk 36 and AGP 8.9.1.
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
