<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuch · Admin layout prototype</title>
<!-- Disposable, fictional-data comparison of three admin layouts at #/admin?variant=A. Isolated from authentication and production mutations for design-only review. -->
<style>
:root{color-scheme:dark;--bg:#000;--panel:#1c1c1e;--raised:#2c2c2e;--line:#3a3a3c;--text:#fff;--muted:#b5b5bd;--accent:#32d74b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:9px 13px}button{cursor:pointer}button:hover{background:#3a3a3c}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #64d2ff;outline-offset:3px}button.active,.primary{background:var(--accent);color:#000;border-color:transparent}h1{font-size:30px;font-weight:600;letter-spacing:-.8px;margin:0}h2{font-size:18px;font-weight:600;margin:0 0 16px}h3{font-size:16px;font-weight:600;margin:0}p{margin:6px 0 16px}.muted,small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:1.5px;color:var(--accent);margin-bottom:10px}.shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.rail{border-right:1px solid var(--line);padding:32px 20px}.brand{font-size:26px;letter-spacing:-1px;font-weight:600;margin-bottom:36px}.brand span{color:var(--accent)}nav{display:grid;gap:8px}nav button{text-align:left;background:none;border-color:transparent}nav button.active{background:#19371f;color:#7bf28d}.foot{margin-top:44px}.workspace{padding:32px 40px 150px;min-width:0}header{display:flex;justify-content:space-between;gap:20px;align-items:start;margin-bottom:32px}.tools,.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:24px 0}.card,.panel{background:var(--panel);border-radius:14px;padding:22px}.metric{font-size:32px;line-height:1.3;margin:8px 0}.cards button{text-align:left;border:0}.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(250px,1fr);gap:20px}.filters{margin:16px 0}.filters input{flex:1;min-width:160px}.user{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;width:100%;text-align:left;align-items:center;padding:16px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}.user:hover{background:#252527}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#314336;color:#a7efb3}.name{overflow-wrap:anywhere}.badge{font-size:12px;color:#86ef9a;background:#15351e;padding:4px 8px;border-radius:6px}.badge.off{color:#ffd39b;background:#49321d}.line{padding:16px 0;border-bottom:1px solid var(--line)}.line:last-child{border:0}.line .badge{display:inline-block;margin-bottom:8px}.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,1fr);gap:24px}.detail{background:#151517;padding:28px;border:1px solid var(--line);border-radius:14px}.detail h2{font-size:24px;overflow-wrap:anywhere}.detail dl{display:grid;grid-template-columns:1fr 1fr;gap:16px}.detail dd{margin:0}.detail dt{color:var(--muted);font-size:13px}.notice{padding:30px 16px;text-align:center;background:#151517;border-radius:12px}.top-shell .shell{display:block}.top-shell .rail{padding:18px 40px;border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:28px;flex-wrap:wrap}.top-shell .brand{margin:0}.top-shell nav{display:flex;flex-wrap:wrap}.top-shell .foot{margin:0}.top-shell .workspace{max-width:1440px;margin:auto}.activity-shell .shell{grid-template-columns:200px minmax(0,1fr)}.activity-shell .cards{grid-template-columns:repeat(2,minmax(0,1fr));margin:0}.activity-layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:24px}.strip{display:flex;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}.switcher{position:fixed;z-index:5;bottom:16px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 14px;background:#eee;color:#111;border:1px solid white;border-radius:16px;box-shadow:0 8px 40px #000a;display:flex;gap:12px;align-items:center}.switcher button,.switcher select{background:white;color:#111;border-color:#ccc}.switcher small{color:#444;display:block}.switcher strong{font-size:14px}.demo{font-size:12px;color:#b5b5bd;margin-bottom:20px}dialog{max-width:560px;width:calc(100% - 32px);border:1px solid #555;border-radius:16px;padding:28px;background:#1c1c1e;color:#fff}dialog::backdrop{background:#000a}.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#e4ffe7;color:#111;padding:12px 20px;border-radius:8px;z-index:9}.state{font-size:12px;color:#bbb;margin-top:24px}a{color:#82e993}@media(max-width:1000px){.workspace{padding:24px 24px 160px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.split,.activity-layout{grid-template-columns:1fr}.shell,.activity-shell .shell{grid-template-columns:190px minmax(0,1fr)}header{flex-direction:column}.top-shell .rail{padding:20px 24px}}@media(max-width:650px){.shell,.activity-shell .shell{display:block}.rail,.top-shell .rail{padding:20px 16px;border:0;border-bottom:1px solid var(--line);display:block}.brand{margin:0 0 14px;font-size:24px}nav,.top-shell nav{display:grid;grid-template-columns:1fr 1fr;gap:4px}nav button{font-size:13px;padding:8px}.foot{margin:12px 0 0!important}.workspace{padding:24px 16px 210px}.cards{gap:10px}.card,.panel{padding:16px}.metric{font-size:26px}h1{font-size:26px}.user{grid-template-columns:32px minmax(0,1fr)}.avatar{width:30px;height:30px}.user>.badge{grid-column:2;justify-self:start}.switcher{flex-wrap:wrap;justify-content:center;gap:8px}.switcher strong{font-size:12px}.switcher select{max-width:135px}.detail{padding:20px}.tools{width:100%}.tools select{flex:1;min-width:140px}}
</style>
<div id="app"></div><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
const words={ru:['Обзор','Пользователи','Приглашения','AI-тренер','Активность','Рабочее пространство','Обновить','К тренировкам','Копировать ссылку','Найти по имени или почте','Все','Активные','Отключённые','Сейчас тренируются','Доступные приглашения','Последние события','Создать приглашение','Администратор','Доступ включён','Доступ отключён','Нет результатов','Попробуйте изменить поиск или фильтр.','Загрузка пользователей…','Не удалось загрузить данные','Повторить','Выберите пользователя','Учётная запись','Последняя синхронизация','Тренировок','Управление доступом','Готово','Пользователи и доступ','Тренировки сейчас','Настройки AI-тренера','Включён · доступен пользователям','Пример интерфейса · вымышленные данные'],uz:['Umumiy','Foydalanuvchilar','Takliflar','AI murabbiy','Faollik','Boshqaruv maydoni','Yangilash','Mashg‘ulotlarga','Havolani nusxalash','Ism yoki pochta bo‘yicha qidirish','Barchasi','Faol','O‘chirilgan','Hozir mashq qilmoqda','Mavjud takliflar','So‘nggi voqealar','Taklif yaratish','Administrator','Kirish yoqilgan','Kirish o‘chirilgan','Natija yo‘q','Qidiruv yoki filtrni o‘zgartiring.','Foydalanuvchilar yuklanmoqda…','Ma’lumotlar yuklanmadi','Qayta urinish','Foydalanuvchini tanlang','Hisob','Oxirgi sinxronlash','Mashg‘ulotlar','Kirishni boshqarish','Tayyor','Foydalanuvchilar va kirish','Hozirgi mashg‘ulotlar','AI murabbiy sozlamalari','Yoqilgan · foydalanuvchilarga ochiq','Interfeys namunasi · xayoliy ma’lumotlar'],cy:['Умумий','Фойдаланувчилар','Таклифлар','AI мураббий','Фаоллик','Бошқарув майдони','Янгилаш','Машғулотларга','Ҳаволани нусхалаш','Исм ёки почта бўйича қидириш','Барчаси','Фаол','Ўчирилган','Ҳозир машқ қилмоқда','Мавжуд таклифлар','Сўнгги воқеалар','Таклиф яратиш','Администратор','Кириш ёқилган','Кириш ўчирилган','Натижа йўқ','Қидирув ёки фильтрни ўзгартиринг.','Фойдаланувчилар юкланмоқда…','Маълумотлар юкланмади','Қайта уриниш','Фойдаланувчини танланг','Ҳисоб','Охирги синхронлаш','Машғулотлар','Киришни бошқариш','Тайёр','Фойдаланувчилар ва кириш','Ҳозирги машғулотлар','AI мураббий созламалари','Ёқилган · фойдаланувчиларга очиқ','Интерфейс намунаси · хаёлий маълумотлар'],en:['Overview','Users','Invites','AI Coach','Activity','Admin workspace','Refresh','Back to workouts','Copy admin link','Search name or email','All','Enabled','Disabled','Working out now','Available invites','Recent activity','Create invite','Administrator','Access enabled','Access disabled','No results','Try a different search or filter.','Loading users…','Could not load data','Retry','Select a user','Account','Last sync','Workouts','Manage access','Done','Users and access','Live workouts','AI Coach settings','Enabled · available to users','Interface prototype · fictional data']};
const people=[['Абдурахмонов Шоҳрух Абдураҳмон ўғли','shohruh@example.test',true,84],['Александра Константинопольская','alexandra@example.test',true,46],['Madina To‘xtamurodova','madina@example.test',true,32],['Дилшод Ғуломов','dilshod@example.test',false,12],['Javohir Alikulov','javohir@example.test',true,118]];
let variant=new URLSearchParams(location.hash.split('?')[1]||location.search).get('variant')||'A';if(!['A','B','C'].includes(variant))variant='A';let lang='ru',section=0,query='',filter='all',state='ready',selected=0;const t=i=>words[lang][i],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nav(){return `<div class="rail"><div class="brand">kuch<span> / </span>admin</div><nav aria-label="Admin">${[0,1,2,3,4].map(i=>`<button class="${section===i?'active':''}" onclick="go(${i})" ${section===i?'aria-current="page"':''}>${t(i)}</button>`).join('')}</nav><div class="foot"><button onclick="note('Prototype: Home / #/home')">← ${t(7)}</button></div></div>`}
function metrics(){return `<div class="cards">${[[1,'128',31],[4,'3',13],[2,'8',14],[3,'AI',33]].map(([s,n,l])=>`<button class="card" onclick="go(${s})"><small>${t(l)}</small><div class="metric">${n}</div><span class="muted">${t(s)} →</span></button>`).join('')}</div>`}
function rows(){if(state==='loading')return `<div role="status" class="notice">${t(22)}</div>`;if(state==='error')return `<div role="alert" class="notice"><h3>${t(23)}</h3><p>Demo · HTTP 503</p><button onclick="state='ready';render()">${t(24)}</button></div>`;let found=state==='empty'?[]:people.map((p,i)=>({p,i})).filter(({p})=>(p[0]+' '+p[1]).toLowerCase().includes(query.toLowerCase())&&(filter==='all'||p[2]===(filter==='enabled')));return found.length?found.map(({p,i})=>`<button class="user" onclick="pick(${i})"><span class="avatar">${p[0][0]}</span><span class="name">${esc(p[0])}<br><small>${p[1]}</small></span><span class="badge ${p[2]?'':'off'}">${t(p[2]?18:19)}</span></button>`).join(''):`<div class="notice"><h3>${t(20)}</h3><p class="muted">${t(21)}</p><button onclick="query='';filter='all';state='ready';render()">${t(10)}</button></div>`}
function users(){return `<section class="panel"><h2>${t(31)}</h2><div class="filters"><input aria-label="${t(9)}" placeholder="${t(9)}" value="${esc(query)}" oninput="query=this.value;document.getElementById('rows').innerHTML=rows()"><select aria-label="Status" onchange="filter=this.value;document.getElementById('rows').innerHTML=rows()">${[['all',10],['enabled',11],['disabled',12]].map(([v,i])=>`<option value="${v}" ${filter===v?'selected':''}>${t(i)}</option>`).join('')}</select></div><div id="rows">${rows()}</div><p class="muted">Demo: 5 / 128</p></section>`}
function detail(){const p=people[selected];return `<div class="detail"><div class="eyebrow">${t(26)}</div><h2>${p[0]}</h2><p class="muted">${p[1]}</p><span class="badge ${p[2]?'':'off'}">${t(p[2]?18:19)}</span><dl><div><dt>${t(28)}</dt><dd>${p[3]}</dd></div><div><dt>${t(27)}</dt><dd>15.10.2026 · 14:32</dd></div></dl><button onclick="note('Demo: account access confirmation would open here. No changes made.')">${t(29)}</button></div>`}
function activity(live=false){return `<section class="panel"><h2>${t(live?32:15)}</h2>${[0,1,2].map((i)=>`<div class="line"><span class="badge">${live?'●  '+(18+i*7)+' min':'14:'+(42-i*9)}</span><h3>${people[i][0]}</h3><p class="muted">${live?'Full body · '+(i+2)+' / 6':t([18,16,27][i])}</p><button onclick="pick(${i})">${t(26)} →</button></div>`).join('')}</section>`}
function invites(){return `<section class="panel"><h2>${t(2)}</h2><p class="muted">8 · ${t(14)}</p><button class="primary" onclick="note('Demo: invitation form would open. No invitation is created.')">+ ${t(16)}</button>${['TEAM-OCT','MORNING-GROUP','PERSONAL'].map(n=>`<div class="strip"><span>${n}</span><small>31.10.2026</small></div>`).join('')}</section>`}
function coach(){return `<section class="panel"><h2>${t(33)}</h2><p><span class="badge">${t(34)}</span></p><div class="strip"><span>Provider</span><span>OpenAI</span></div><div class="strip"><span>Model</span><span>Demo model</span></div><p class="muted">API key · ••••••••</p><button onclick="note('Demo: AI configuration form. No credentials or requests are sent.')">${t(33)} →</button></section>`}
function VariantA(){return `${metrics()}<div class="grid">${users()}${activity(true)}</div>`}
function VariantB(){return `<div class="split">${users()}<aside id="details">${detail()}<div style="margin-top:20px">${invites()}</div></aside></div>`}
function VariantC(){return `<div class="activity-layout"><div>${activity(true)}<div style="margin-top:24px">${activity()}</div></div><aside>${metrics()}<div style="margin-top:24px">${invites()}</div><div style="margin-top:24px">${coach()}</div></aside></div>`}
function render(){document.documentElement.lang=lang==='cy'?'uz-Cyrl':lang;document.body.className=variant==='B'?'top-shell':variant==='C'?'activity-shell':'';document.getElementById('app').innerHTML=`<div class="shell">${nav()}<main class="workspace"><div class="demo">${t(35)}</div><header><div><div class="eyebrow">KUCH / ADMIN</div><h1>${section?t(section):t(5)}</h1></div><div class="tools"><select aria-label="Language" onchange="changeLang(this.value)">${[['ru','Русский'],['cy','Ўзбекча'],['uz','O‘zbekcha'],['en','English']].map(([v,l])=>`<option value="${v}" ${lang===v?'selected':''}>${l}</option>`).join('')}</select><button onclick="note(t(30))">↻ ${t(6)}</button><button onclick="note('Demo canonical link: https://example.test/gym/#/admin')">${t(8)}</button></div></header>${section===1?`<div class="split">${users()}<aside id="details">${detail()}</aside></div>`:section===2?invites():section===3?coach():section===4?`<div class="grid">${activity(true)}${activity()}</div>`:({A:VariantA,B:VariantB,C:VariantC}[variant])()}<p class="state">Prototype state: variant=${variant} · section=${section} · locale=${lang} · data=${state} · selected=${selected} · persistence=none</p></main></div><div class="switcher" aria-label="Prototype controls"><button aria-label="Previous variant" onclick="cycle(-1)">←</button><div><strong>${variant} · ${{A:'Overview + sidebar',B:'Directory + detail',C:'Activity first'}[variant]}</strong><small>Disposable design comparison</small></div><button aria-label="Next variant" onclick="cycle(1)">→</button><select aria-label="Demo data state" onchange="state=this.value;section=1;render()">${['ready','empty','loading','error'].map(v=>`<option ${state===v?'selected':''}>${v}</option>`).join('')}</select></div>`}
function changeLang(value){lang=value;render()}function go(i){section=i;render()}function cycle(d){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+d+3)%3];history.replaceState(null,'','#/admin?variant='+variant);render()}function pick(i){selected=i;const target=document.getElementById('details');if(target){target.innerHTML=detail();if(innerWidth<1000)target.scrollIntoView({behavior:'smooth',block:'start'})}else{const m=document.getElementById('modal');m.innerHTML=detail()+`<p></p><button onclick="document.getElementById('modal').close()">${t(30)}</button>`;m.showModal()}}let timer;function note(s){const n=document.getElementById('toast');n.className='toast';n.textContent=s;clearTimeout(timer);timer=setTimeout(()=>{n.className='';n.textContent=''},3500)}document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable]')||document.getElementById('modal').open)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();cycle(e.key==='ArrowRight'?1:-1)}});render();
</script></html>
